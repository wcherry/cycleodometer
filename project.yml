name: CycleOdometer
options:
  bundleIdPrefix: com.williamcherry
  deploymentTarget:
    iOS: "17.0"

targets:
  CycleOdometer:
    type: application
    platform: iOS
    sources:
      - path: CycleOdometer
    info:
      path: CycleOdometer/Info.plist
      properties:
        CFBundleDisplayName: Cycle
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # Keep counting distance when the phone is locked in a handlebar mount.
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: Your location is used to measure speed and distance while you ride.
        NSAppleMusicUsageDescription: Used to play and pause your music during a ride.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.williamcherry.cycleodometer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "46KWJJ63FU"
        CODE_SIGN_STYLE: Automatic
