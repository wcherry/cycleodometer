name: CycleOdometer
options:
  bundleIdPrefix: com.williamcherry
  deploymentTarget:
    iOS: "26.0"

# Shared by the app and its widget extension, whose versions must match for App Store
# Connect. scripts/deploy_testflight.sh bumps them here.
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "46KWJJ63FU"
    CODE_SIGN_STYLE: Automatic

targets:
  CycleOdometer:
    type: application
    platform: iOS
    sources:
      - path: CycleOdometer
    info:
      path: CycleOdometer/Info.plist
      properties:
        CFBundleDisplayName: Cycle
        # Driven from the build settings below, which scripts/deploy_testflight.sh bumps.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Keep counting distance when the phone is locked in a handlebar mount, and keep
        # speaking turn cues (VoicePrompter) while it is.
        UIBackgroundModes: [location, audio]
        NSLocationWhenInUseUsageDescription: Your location is used to measure speed and distance while you ride.
        NSMotionUsageDescription: The barometer is used to measure the incline of the road.
        NSAppleMusicUsageDescription: Used to play and pause your music during a ride.
        # Which directions apps are installed (Settings > Directions App), and lets Open
        # in Google Maps send 9 waypoints to the app instead of 3 to a browser.
        LSApplicationQueriesSchemes: [comgooglemaps, citymapper]
        # GPX: what routes are shared as and imported from. Opening a .gpx file from
        # another app hands Cycle a copy (not in place), which it imports and deletes.
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX Route
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx]
        LSSupportsOpeningDocumentsInPlace: false
        # The ride on the Lock Screen and in the Dynamic Island (CycleOdometerWidgets).
        NSSupportsLiveActivities: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
    dependencies:
      - target: CycleOdometerWidgets
    scheme:
      testTargets:
        - CycleOdometerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.williamcherry.cycleodometer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CycleOdometerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CycleOdometerWidgets
      # The Live Activity's data, shared with the app.
      - path: CycleOdometer/RideActivityAttributes.swift
    info:
      path: CycleOdometerWidgets/Info.plist
      properties:
        CFBundleDisplayName: Cycle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.williamcherry.cycleodometer.widgets
        TARGETED_DEVICE_FAMILY: "1"

  CycleOdometerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CycleOdometerTests
    dependencies:
      - target: CycleOdometer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.williamcherry.cycleodometer.tests
        GENERATE_INFOPLIST_FILE: YES
